<!DOCTYPE HTML>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
    <!-- include jQuery library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.js"></script>

    <script type="text/javascript" th:inline="javascript">

        function uploadMessage(spaceId) {
            const link = /*[[@{/uploadMessagesJson}]]*/'';
            var file = document.getElementById(spaceId + '-message').files[0];
            var formData = new FormData();
            formData.append('file', file);
            formData.append('spaceId', spaceId);
            $.ajax(
                link,
                {
                    type: 'post',
                    processData: false,
                    contentType: false,
                    data: formData,
                    dataType: "html",
                    success: function (data) {
                        $('#' + spaceId + '-message-filename').val(data);
                    },
                    error: function (XMLHttpRequest, textStatus, errorThrown) {
                    }
                });
        }

        function uploadGroupInfo(spaceId) {
            const link = /*[[@{/uploadGroupInfoJson}]]*/'';
            var file = document.getElementById(spaceId + '-group').files[0];
            var formData = new FormData();
            formData.append('file', file);
            formData.append('spaceId', spaceId);
            $.ajax(
                link,
                {
                    type: 'post',
                    processData: false,
                    contentType: false,
                    data: formData,
                    dataType: "html",
                    success: function (data) {
                        $('#' + spaceId + '-group-filename').val(data);
                    },
                    error: function (XMLHttpRequest, textStatus, errorThrown) {
                    }
                });
        }

        function importJson(spaceId) {
            const link = /*[[@{/importJson}]]*/'';
            $.ajax(
                link,
                {
                    type: 'get',
                    data: { spaceId: spaceId, filenameOfMessagesJson: $('#' + spaceId + '-message-filename').val(), filenameOfGroupInfoJson: $('#' + spaceId + '-group-filename').val() },
                    dataType: "html",
                    success: function (data) {
                    },
                    error: function (XMLHttpRequest, textStatus, errorThrown) {
                    }
                });
        }

        function uploadImport(spaceId) {
            var importButton = document.getElementById('import-trigger');
            var cancelButton = document.getElementById('cancel-trigger');
            var statusMessage = document.getElementById('upload-dialog-message');

            importButton.disabled = false;
            cancelButton.disabled = false;
            cancelButton.textContent = 'キャンセル';
            statusMessage.textContent = 'メッセージデータのインポートを実行します。';

            var messageFile = document.getElementById(spaceId + '-message').files[0];
            var groupFile = document.getElementById(spaceId + '-group').files[0];

            if (messageFile == null || groupFile == null) {
                statusMessage.textContent = 'ファイルが選択されていません。';
                importButton.disabled = true;
                cancelButton.textContent = '閉じる';
                document.getElementById('upload-dialog').showModal();
            } else {
                importButton.onclick = function () {
                    importButton.disabled = true;
                    cancelButton.disabled = true;
                    statusMessage.textContent = 'インポートを実行中です。';
                    $.Deferred().resolve()
                        .then(function () {
                            uploadMessage(spaceId);
                        })
                        .then(function () {
                            uploadGroupInfo(spaceId);
                        })
                        .then(function () {
                            importJson(spaceId);
                        })
                        .done(function () {
                            cancelButton.textContent = '閉じる';
                            cancelButton.disabled = false;
                            statusMessage.textContent = 'インポートが正常に完了しました。';
                        })
                        .fail(function () {
                            importButton.disabled = false;
                            cancelButton.disabled = false;
                            statusMessage.textContent = 'インポートに失敗しました。';
                        });
                };
                document.getElementById('upload-dialog').showModal();
            }
        }

    </script>
</head>

<body>
    <div layout:fragment="contents">

        <h2>DB登録済みのスペース一覧 (<span th:text="${spaceCount}"></span>)</h2>
        <table border="1">
            <tr>
                <th width="60px">spaceId</th>
                <th width="150px">spaceName</th>
                <th width="60px">accessState</th>
                <th width="90px">memberCount</th>
                <th width="90px">messageCount</th>
                <th width="60px">imported</th>
                <th width="120px">lastImportedUser</th>
                <th width="120px">lastImportedDate</th>
                <th>messages.json</th>
                <th>group_info.json</th>
                <th width="120px">import</th>
            </tr>
            <tr th:each="space:${spaceList}">
                <td><a th:href="@{/{space.spaceId}/messages(space.spaceId=${space.spaceId})}">
                        <span th:text="${space.spaceId}"></span></td>
                </a>
                <td><span th:text="${space.displayName}"></span></td>
                <td><span th:text="${space.accessState}"></span></td>
                <td><span th:text="${space.memberCount}"></span></td>
                <td><span th:text="${space.messageCount}"></span></td>
                <td><span th:text="${space.imported}"></span></td>
                <td><span th:text="${space.lastImportedUser}"></span></td>
                <td><span th:text="${space.lastImportedDate}"></span></td>
                <td><input type="file" th:id="${space.spaceId} + '-message'" class="json-uploader"
                        accept="messages.json"></input>
                    <input type="hidden" th:id="${space.spaceId} + '-message-filename'"></input>
                </td>
                <td><input type="file" th:id="${space.spaceId} + '-group'" class="json-uploader"
                        accept="group-info.json"></input>
                    <input type="hidden" th:id="${space.spaceId} + '-group-filename'"></input>
                </td>
                <td>
                    <button th:onclick="|uploadImport('__${space.spaceId}__');|">インポート</button>
                </td>
            </tr>
        </table>

        <dialog id="upload-dialog">
            <header>メッセージデータのインポート</header>
            <p id="upload-dialog-message"></p>
            <button id="import-trigger">実行</button>
            <button id="cancel-trigger" onclick="document.getElementById('upload-dialog').close()">キャンセル</button>
        </dialog>


    </div>


</body>

</html>
