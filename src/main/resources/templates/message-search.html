<!DOCTYPE HTML>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
    <script type="text/javascript" th:inline="javascript">
        function search() {
            const link = /*[[@{/messages}]]*/'';
            var keyword = document.getElementById("keyword").value;
            var queryType = document.getElementById("query-type").value;
            var creatorEmail = document.getElementById("creatorEmail").value;
            var queryScope = document.querySelector("input[name='q1']:checked").value;
            var spaceId = document.getElementById("spaceId").value;
            var startDate = document.getElementById("start-date").value;
            var endDate = document.getElementById("end-date").value;

            location.href = link + "?"
                + "queryType=" + queryType + "&"
                + "queryScope=" + queryScope + "&"
                + "creatorEmail=" + creatorEmail + "&"
                + "spaceId=" + spaceId + "&"
                + "startDate=" + startDate + "&"
                + "endDate=" + endDate + "&"
                + "keyword=" + encodeURIComponent(keyword);

        }
    </script>
</head>

<body>
    <div layout:fragment="contents">

        <h1>メッセージを探す</h1>
        <h2>検索条件</h2>
        <div class="search-area">
            <div>
                <select id="query-type" style="width:194px">
                    <option value="messageText" th:selected="${queryType} eq 'messageText'">メッセージ本文</option>
                    <option value="url" th:selected="${queryType} eq 'url'">URL</option>
                </select>
                <input type="text" id="keyword" size="80" th:value="${keyword}"></input>
            </div>
            <div>
                <span style="padding:10px;width:200px">メッセージ投稿日</span>
                <input type="date" id="start-date" th:value="${startDate}"></input>
                <input type="date" id="end-date" th:value="${endDate}"></input>
            </div>
            <div>
                <span style="padding:10px;width:200px">メッセージ投稿者</span>
                <input type="text" id="creatorEmail" th:value="${creatorEmail}" size="30"></input>
            </div>
            <div style="display:flex;">
                <span style="padding:10px;width:200px">検索スコープ</span>
                <div>
                    <label class="radio">
                        <input type="radio" name="q1" value="PRIVATE_DISCOVERABLE"
                            th:checked="${queryScope == null || queryScope eq 'PRIVATE_DISCOVERABLE'}" />自身が参加していたスペース全体
                    </label>
                    <label class="radio">
                        <input type="radio" name="q1" value="DISCOVERABLE"
                            th:checked="${queryScope} eq 'DISCOVERABLE'" />DISCOVERABLEなスペース全体(参加していないスペースを含む)
                    </label>
                    <label class="radio">
                        <input type="radio" name="q1" value="SPACE" th:checked="${queryScope} eq 'SPACE'" />特定スペース<input
                            type="text" id="spaceId" th:value="${spaceId}" size="30">
                    </label>
                </div>

            </div>
            <input type="button" value="検索" onclick="search();">
        </div>

        <h2>検索結果 <span th:if="${queryTime != null}" th:text="${queryTime} + 'ミリ秒'"></span></h2>
        <table border="1">
            <tr>
                <th width="120px">spaceId</th>
                <th width="120px">spaceName</th>
                <th width="120px">messageId</th>
                <th width="120px">topicId</th>
                <th width="120px">creatorName</th>
                <th width="120px">creatorEmail</th>
                <th width="120px">createdDate</th>
                <th>messageText</th>
            </tr>
            <tr th:each="message:${messageList}">
                <td><a th:href="@{/{spaceId}/messages(spaceId=${message.spaceId})}"><span
                            th:text="${message.spaceId}"></span></a></td>
                <td><span th:text="${message.spaceName}"></span></td>
                <td><a
                        th:href="@{/{spaceId}/messages?dateFrom={createdDate}(spaceId=${message.spaceId},createdDate=${message.urlSafeCreatedDate})}"><span
                            th:text="${message.messageId}"></span></a></td>
                <td><span th:text="${message.topicId}"></span></td>
                <td><span th:text="${message.creatorName}"></span></td>
                <td><span th:text="${message.creatorEmail}"></span></td>
                <td><span th:text="${message.createdDate}"></span></td>
                <td><span th:utext="${message.messageText}"></span></td>
            </tr>
        </table>
    </div>
</body>

</html>
