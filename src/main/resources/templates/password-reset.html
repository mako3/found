<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>found</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <link rel="icon" th:href="@{/favicon.ico}" />
    <link th:href="@{/css/gchat.css}" rel="stylesheet" />
</head>

<body style="min-height: 100vh; display:flex; justify-content:center; align-items:center;">

    <div style="width:800px;height:400px;">
        <h2>パスワードの再発行</h2>

        <div th:if="${failureMessage != null}" th:text="${failureMessage}" class="alert" style="width:600px;">
        </div>

        <p>新しいパスワードを入力してください。パスワードは以下の入力規則を満たす必要があります。</p>
        <ul>
            <li>8文字以上</li>
        </ul>

        <form method="post" th:action="@{/password/reset/do-reset}">
            <input type="hidden" name="token" th:value="${token}" />
            <div>
                <span style="padding:10px;width:200px">新しいパスワード</span>
                <input type="password" name="password" style="width:400px;" />
            </div>
            <div style="margin-top:40px; margin-bottom:120px; display:inline-flex; align-items:center;">
                <input type="submit" value="パスワードの更新" />
            </div>


        </form>
    </div>


</body>

</html>
