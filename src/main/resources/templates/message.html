<!DOCTYPE HTML>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
</head>

<body>
    <div layout:fragment="contents">

        <h1 th:text="${space.displayName}"></h1>


        <div class="readmore">
            <input id="readmore" type="checkbox">
            <label for="readmore"></label>
            <div class="readmore-content">
                <h2>スペース情報</h2>
                <table border="1">
                    <tr>
                        <th>space id</th>
                        <th>space name</th>
                        <th>access state</th>
                        <th>member count</th>
                        <th>message count</th>
                        <th>last imported user</th>
                        <th>last imported date</th>
                    </tr>
                    <tr>
                        <td><span th:text="${space.spaceId}"></span></td>
                        <td><span th:text="${space.displayName}"></span></td>
                        <td><span th:text="${space.accessState}"></span></td>
                        <td><span th:text="${space.memberCount}"></span></td>
                        <td><span th:text="${space.messageCount}"></span></td>
                        <td><span th:text="${space.lastImportedUser}"></span></td>
                        <td><span th:text="${#temporals.format(space.lastImportedDate, 'yyyy-MM-dd HH:mm:ss')}"></span>
                        </td>
                    </tr>
                </table>
                <h2>参加メンバー</h2>
                <span th:text="${space.memberIds}"></span>
            </div>
        </div>

        <div class="header-pagenator">
            <h2>メッセージ一覧</h2>
            <div>
                <input type="button" value="prev" th:disabled="${prev eq false}"
                    th:onclick="|location.href='@{/__${spaceId}__/messages?seqFrom=__${seqPrevFrom}__&seqTo=__${seqPrevTo}__}'|" />
                <input type="button" value="next" th:disabled="${next eq false}"
                    th:onclick="|location.href='@{/__${spaceId}__/messages?seqFrom=__${seqNextFrom}__&seqTo=__${seqNextTo}__}'|" />
            </div>
        </div>
        <table border="1">
            <tr>
                <th width="30px"></th>
                <th width="120px">message id</th>
                <th width="120px">creator name</th>
                <th width="120px">creator email</th>
                <th width="120px">created date</th>
                <th>message text</th>
                <th width="30px">file</th>
            </tr>
            <tr th:each="message:${messageList}">
                <td>
                    <th:block th:if="${!message.threadReply and message.hasReply}">
                        <div class="ant-table-row-expand-icon ant-table-row-collapsed"></div>
                    </th:block>
                    <th:block th:if="${message.threadReply}">
                        ∟
                    </th:block>
                </td>
                <td><span th:text="${message.messageId}"></span></td>
                <td><span th:text="${message.creatorName}"></span></td>
                <td><span th:text="${message.creatorEmail}"></span></td>
                <td><span th:text="${#temporals.format(message.createdDate, 'yyyy-MM-dd HH:mm:ss')}"></span></td>
                <td><span th:text="${message.messageText}"></span></td>
                <td><span th:if="!${#lists.isEmpty(message.attachedFiles)}"
                        th:title="${message.attachedFiles}">📁</span></td>

            </tr>
        </table>
        <div class="header-pagenator">
            <div>
                <input type="button" value="prev" th:disabled="${prev eq false}"
                    th:onclick="|location.href='@{/__${spaceId}__/messages?seqFrom=__${seqPrevFrom}__&seqTo=__${seqPrevTo}__}'|" />
                <input type="button" value="next" th:disabled="${next eq false}"
                    th:onclick="|location.href='@{/__${spaceId}__/messages?seqFrom=__${seqNextFrom}__&seqTo=__${seqNextTo}__}'|" />
            </div>
        </div>

    </div>
</body>

</html>
