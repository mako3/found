<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>found</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <link rel="icon" th:href="@{/favicon.ico}" />
    <link th:href="@{/css/gchat.css}" rel="stylesheet" />
</head>

<body style="min-height: 100vh; display:flex; justify-content:center; align-items:center;">

    <div style="width:800px;height:400px;">
        <h2>パスワードの再発行</h2>

        <div th:if="${successMessage != null}" th:text="${successMessage}" class="success" style="width:600px;">
        </div>
        <div th:if="${failureMessage != null}" th:text="${failureMessage}" class="alert" style="width:600px;">
        </div>

        <p>入力されたメールアドレスが登録されている場合、パスワード再発行のためのメールが送信されます。</p>
        <form method="post" th:action="@{/password/reset/send-token}">
            <div>
                <label style="padding:10px;width:200px">メールアドレス</label>
                <input type="text" name="email" autocomplete="on" style="width:400px;" />
            </div>
            <div style="margin-top:40px; margin-bottom:120px; display:inline-flex; align-items:center;">
                <input type="submit" value="パスワード再発行を要求" />
                <input type="button" value="戻る" th:onclick="history.back();" />
            </div>
        </form>
    </div>

</body>

</html>
